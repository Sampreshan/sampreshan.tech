name: Deploy demo site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'demo.html'
      - 'preview.html'
      - 'assets/**'
      - 'css/**'
      - 'js/**'
      - 'images/**'
      - 'img/**'
      - 'fonts/**'
      - 'favicon.ico'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      optional_dirs:
        description: 'Space-separated optional directories to publish'
        required: false
        default: 'assets css js images img fonts'
      optional_files:
        description: 'Space-separated optional files to publish'
        required: false
        default: 'favicon.ico robots.txt sitemap.xml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build static demo artifact
        id: build
        env:
          PAGES_OPTIONAL_DIRS: ${{ github.event.inputs.optional_dirs || 'assets css js images img fonts' }}
          PAGES_OPTIONAL_FILES: ${{ github.event.inputs.optional_files || 'favicon.ico robots.txt sitemap.xml' }}
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          # Use if-blocks: a trailing false `[ ] && cp` would abort under set -e.
          entry=0
          for file in index.html demo.html preview.html; do
            if [ -f "$file" ]; then cp "$file" site/; entry=1; fi
          done
          for dir in $PAGES_OPTIONAL_DIRS; do
            if [ -d "$dir" ]; then cp -R "$dir" site/; fi
          done
          for file in $PAGES_OPTIONAL_FILES; do
            if [ -f "$file" ]; then cp "$file" site/; fi
          done
          if [ "$entry" -eq 0 ]; then
            echo "::notice::No demo entry HTML (index/demo/preview.html) in repo root; skipping Pages deploy."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          touch site/.nojekyll
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        if: steps.build.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        if: steps.build.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
