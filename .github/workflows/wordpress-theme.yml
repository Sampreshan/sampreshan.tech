name: Validate and deploy WordPress child theme

on:
  push:
    branches: [main]
    paths:
      - 'buddyboss-theme-child/**'
      - 'content/sangyani/**'
      - 'tools/tests/**'
      - 'tools/build-sangyani-notes.py'
      - '.github/workflows/wordpress-theme.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wordpress-theme-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate theme
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lint PHP
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find buddyboss-theme-child -type f -name '*.php' -not -path '*/vendor/*' -print0)

      - name: Verify resumable quiz protocol and all 500 cards
        run: php tools/tests/sangyani-regression.php

      - name: Validate quiz JavaScript
        run: node --check buddyboss-theme-child/assets/js/quiz.js

      - name: Check whitespace
        run: git diff --check

      - name: No emoji (own icon kit only, docs/ICON-RULES.md)
        run: python3 tools/check-no-emoji.py buddyboss-theme-child
      - name: English-only display text
        run: python3 tools/check-english-only.py buddyboss-theme-child

      - name: Build theme archive
        run: |
          mkdir -p build
          zip -qr build/sampreshan-child-${GITHUB_SHA::12}.zip buddyboss-theme-child \
            -x '*/.DS_Store' '*/node_modules/*'

      - name: Upload theme artifact
        uses: actions/upload-artifact@v4
        with:
          name: sampreshan-child-theme
          path: build/*.zip
          if-no-files-found: error

  deploy:
    name: Deploy theme over SFTP
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sampreshan.tech
    env:
      WP_DEPLOY_HOST: ${{ secrets.WP_DEPLOY_HOST }}
      WP_DEPLOY_PORT: ${{ secrets.WP_DEPLOY_PORT }}
      WP_DEPLOY_USER: ${{ secrets.WP_DEPLOY_USER }}
      WP_DEPLOY_KEY: ${{ secrets.WP_DEPLOY_KEY }}
      WP_DEPLOY_TARGET: ${{ secrets.WP_DEPLOY_TARGET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment configuration
        id: config
        shell: bash
        run: |
          if [[ -n "$WP_DEPLOY_HOST" && -n "$WP_DEPLOY_USER" && -n "$WP_DEPLOY_KEY" && -n "$WP_DEPLOY_TARGET" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Production deploy skipped: WP_DEPLOY_* secrets are not configured.'
          fi

      - name: Deploy child theme
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$WP_DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${WP_DEPLOY_PORT:-22}" -H "$WP_DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # The study bank is runtime data outside the public webroot. Prepare
          # it before switching the theme reader; fail safely if access is missing.
          ssh -i ~/.ssh/deploy_key -p "${WP_DEPLOY_PORT:-22}" -o IdentitiesOnly=yes \
            "$WP_DEPLOY_USER@$WP_DEPLOY_HOST" bash -s -- "${WP_DEPLOY_TARGET%/}" <<'BANK'
          set -euo pipefail
          wp_root="$(cd "$1/../.." && pwd)"
          test -f "$wp_root/wp-config.php"
          bank="$(dirname "$wp_root")/private/sangyani"
          if [ ! -d "$bank" ]; then
            mkdir -p "$bank"
            chmod 750 "$bank"
          fi
          # Provision a scoped ACL for a dedicated deploy account; do not
          # require ownership changes or broad access to the private parent.
          test -r "$bank" && test -w "$bank" && test -x "$bank"
          BANK
          rsync -rlz --checksum --no-perms --no-times --omit-dir-times \
            --include '[0-9][0-9].txt' --exclude '*' \
            -e "ssh -i ~/.ssh/deploy_key -p ${WP_DEPLOY_PORT:-22} -o IdentitiesOnly=yes" \
            content/sangyani/ \
            "$WP_DEPLOY_USER@$WP_DEPLOY_HOST:${WP_DEPLOY_TARGET%/}/../../../private/sangyani/"
          # Files stay owned by the site user; sync content only (no perms/times/owner).
          rsync -rlz --checksum --no-perms --no-times --omit-dir-times \
            --exclude '.DS_Store' --exclude 'node_modules/' --exclude 'assets/icons/kit-src/' \
            -e "ssh -i ~/.ssh/deploy_key -p ${WP_DEPLOY_PORT:-22} -o IdentitiesOnly=yes" \
            buddyboss-theme-child/ \
            "$WP_DEPLOY_USER@$WP_DEPLOY_HOST:${WP_DEPLOY_TARGET%/}/buddyboss-theme-child/"
          # New files are created as the deploy user; hand them back to the
          # owner of the theme directory (the site user), then purge cache.
          # Best-effort: a non-root deploy user cannot chown, which is fine.
          ssh -i ~/.ssh/deploy_key -p "${WP_DEPLOY_PORT:-22}" -o IdentitiesOnly=yes \
            "$WP_DEPLOY_USER@$WP_DEPLOY_HOST" bash -s -- "${WP_DEPLOY_TARGET%/}" <<'REMOTE' || true
          set -u
          theme="$1/buddyboss-theme-child"
          owner="$(stat -c '%U:%G' "$theme/template-quiz.php")"
          wp_root="$(cd "$1/../.." && pwd)"
          bank="$(dirname "$wp_root")/private/sangyani"
          # The bank's inherited ACL keeps it readable by the WordPress user
          # when files are created by the dedicated deployment account.
          # Retire only the known legacy public study-bank files. Retain a
          # private copy for rollback, without deleting unrelated theme files.
          mkdir -p "$bank/legacy"
          for n in 01 02 03 04 05 06 07 08 09 10; do
            if [ -f "$theme/inc/quiz/bank/$n.txt" ]; then
              mv "$theme/inc/quiz/bank/$n.txt" "$bank/legacy/$n.txt"
            fi
          done
          chown -R "$owner" "$theme" 2>/dev/null \
            || sudo -n /usr/bin/chown -R "$owner" "$theme" 2>/dev/null \
            || echo "chown skipped (no permission; see /etc/sudoers.d/sampreshan-deploy-chown)"
          wp_root="$(cd "$1/../.." && pwd)"
          if command -v wp >/dev/null 2>&1; then
            wp --path="$wp_root" --allow-root litespeed-purge all 2>/dev/null || true
          fi
          REMOTE
          rm -f ~/.ssh/deploy_key

      - name: Smoke test live homepage
        if: steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 https://sampreshan.tech/ >/tmp/sampreshan-home.html
          grep -q 'sampreshan-child' /tmp/sampreshan-home.html
          curl --fail --silent --show-error --location --max-time 30 https://sampreshan.tech/sanatan-quiz/ >/tmp/sampreshan-quiz.html
          grep -q 'data-start-form' /tmp/sampreshan-quiz.html
          grep -q 'data-level="10"' /tmp/sampreshan-quiz.html
          bank_status="$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}' https://sampreshan.tech/wp-content/themes/buddyboss-theme-child/inc/quiz/bank/01.txt)"
          [[ "$bank_status" == 403 || "$bank_status" == 404 ]]
